name: Keep Streamlit app awake

on:
  schedule:
    - cron: '0 12 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping app to prevent it from sleeping
        run: curl -sSf --retry 3 --retry-delay 10 "https://renacer-holistico-app-n54wecxvecthschqc5cr8i.streamlit.app/" -o /dev/null
